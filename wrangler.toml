name = "newsletter-buddy"
main = "src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# Bundle interests.md as a string import.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "newsletter-buddy"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"

[triggers]
crons = ["0 7 * * *"]

[vars]
TIMEZONE = "Europe/Warsaw"
DIGEST_HOUR = "8"
FORWARDING_ADDRESS = "you@example.com"
MAX_ARTICLES_PER_NEWSLETTER = "12"
MIN_ARTICLE_WORDS = "300"

# Secrets configured via `wrangler secret put`:
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
#   TELEGRAM_WEBHOOK_SECRET
#   ANTHROPIC_API_KEY
